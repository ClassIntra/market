<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 桌宠图标：像素团子 × 女仆头饰，薄荷绿渐变容器（整套图标中唯一的绿，明快区隔） -->
  <defs>
    <linearGradient id="petMint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CE8CD"/>
      <stop offset="0.55" stop-color="#52C9AC"/>
      <stop offset="1" stop-color="#34A98E"/>
    </linearGradient>
    <linearGradient id="petSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 圆角方容器（iOS 图标栅格 ~22% 圆角）+ 内圈细白描边 -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#petMint)"/>
  <rect x="7" y="7" width="498" height="498" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="6"/>
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#petSheen)"/>
  <!-- 高光星星点缀 -->
  <path d="M96 128 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" fill="#FFFFFF" opacity="0.85"/>
  <path d="M420 368 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 z" fill="#FFFFFF" opacity="0.6"/>
  <!-- 团子投影 -->
  <ellipse cx="256" cy="382" rx="138" ry="15" fill="#1F5F52" opacity="0.2"/>
  <!-- 像素团子（原 128 画布造型 ×3 居中）+ 顶部女仆头饰白边 -->
  <g transform="translate(112,52) scale(3)">
    <!-- 女仆头饰：三段白色荷叶边 -->
    <rect x="44" y="16" width="40" height="8" fill="#FFFFFF"/>
    <rect x="52" y="8" width="24" height="8" fill="#FFFFFF"/>
    <rect x="36" y="24" width="56" height="8" fill="#FFFFFF"/>
    <!-- 团子本体（原造型） -->
    <rect x="40" y="32" width="48" height="8" fill="#FFD60A"/>
    <rect x="32" y="40" width="64" height="8" fill="#FFD60A"/>
    <rect x="24" y="48" width="80" height="8" fill="#FFD60A"/>
    <rect x="16" y="56" width="96" height="24" fill="#FFD60A"/>
    <rect x="24" y="80" width="80" height="8" fill="#FF7B92"/>
    <rect x="32" y="64" width="8" height="8" fill="#1B1B1F"/>
    <rect x="88" y="64" width="8" height="8" fill="#1B1B1F"/>
    <rect x="60" y="80" width="8" height="8" fill="#1B1B1F"/>
    <rect x="16" y="80" width="96" height="16" fill="#FFD60A"/>
    <rect x="24" y="96" width="80" height="8" fill="#FFD60A"/>
    <rect x="40" y="104" width="48" height="8" fill="#FFD60A"/>
  </g>
</svg>
