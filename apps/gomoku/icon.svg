<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 棋盘木纹渐变 -->
    <linearGradient id="gWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E7C4"/>
      <stop offset="0.55" stop-color="#EFD3A0"/>
      <stop offset="1" stop-color="#DFB878"/>
    </linearGradient>
    <!-- 黑子：左上高光球体感 -->
    <radialGradient id="gBlack" cx="0.34" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#70757E"/>
      <stop offset="0.35" stop-color="#2B2E34"/>
      <stop offset="1" stop-color="#0A0B0E"/>
    </radialGradient>
    <!-- 白子：珍珠光泽 -->
    <radialGradient id="gWhite" cx="0.34" cy="0.28" r="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#F0F3F7"/>
      <stop offset="1" stop-color="#C4CEDA"/>
    </radialGradient>
    <!-- 棋子投影 -->
    <filter id="fStoneShadow" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#59400F" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- 木纹棋盘直角满铺（不留白不烘圆角，圆角由 AppIcon 容器 CSS 统一裁切） -->
  <rect width="512" height="512" fill="url(#gWood)"/>
  <!-- 顶部柔光提升通透感 -->
  <ellipse cx="256" cy="80" rx="320" ry="175" fill="#FFFFFF" opacity="0.13"/>
  <!-- 边缘内描边提亮 -->
  <rect x="2" y="2" width="508" height="508" fill="none" stroke="#FFF7E6" stroke-opacity="0.65" stroke-width="4"/>

  <!-- 5x5 网格：线落在 92/174/256/338/420 -->
  <g stroke="#9A7440" stroke-width="8" stroke-linecap="round" opacity="0.72">
    <path d="M92 92H420M92 174H420M92 256H420M92 338H420M92 420H420"/>
    <path d="M92 92V420M174 92V420M256 92V420M338 92V420M420 92V420"/>
  </g>
  <!-- 天元星位 -->
  <circle cx="256" cy="256" r="12" fill="#9A7440" opacity="0.75"/>

  <!-- 黑子（左上第二线交点） -->
  <g filter="url(#fStoneShadow)">
    <circle cx="174" cy="174" r="54" fill="url(#gBlack)"/>
  </g>
  <ellipse cx="155" cy="155" rx="23" ry="15" fill="#FFFFFF" opacity="0.42" transform="rotate(-24 155 155)"/>

  <!-- 白子（右下第二线交点） -->
  <g filter="url(#fStoneShadow)">
    <circle cx="338" cy="338" r="54" fill="url(#gWhite)"/>
  </g>
  <circle cx="338" cy="338" r="54" fill="none" stroke="#9FAEC1" stroke-opacity="0.55" stroke-width="3"/>
  <ellipse cx="319" cy="319" rx="21" ry="14" fill="#FFFFFF" opacity="0.9" transform="rotate(-24 319 319)"/>
</svg>
