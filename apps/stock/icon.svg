<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1E25"/>
      <stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C93A3F"/>
      <stop offset="1" stop-color="#F0595E"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A8E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFB3B6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 网格 -->
  <g stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="0.8">
    <path d="M8 20h48M8 32h48M8 44h48"/>
  </g>

  <!-- 蜡烛 1：跌（绿） -->
  <g>
    <path d="M16 33v9" stroke="#30A46C" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="12.6" y="36" width="6.8" height="5.2" rx="1.2" fill="#30A46C"/>
  </g>

  <!-- 蜡烛 2：涨（红） -->
  <g>
    <path d="M28 20v20" stroke="#E5484D" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="24.6" y="24" width="6.8" height="12.4" rx="1.2" fill="url(#up)"/>
  </g>

  <!-- 蜡烛 3：大涨（红，长实体） -->
  <g>
    <path d="M40 12v26" stroke="#E5484D" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="36.6" y="17" width="6.8" height="15.5" rx="1.2" fill="url(#up)"/>
  </g>

  <!-- 上攻折线 -->
  <path d="M11 45 L22 39 L31 41 L41 27 L53 16"
        fill="none" stroke="url(#line)" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="53" cy="16" r="3" fill="#FFB3B6"/>
  <circle cx="53" cy="16" r="6.4" fill="#FFB3B6" fill-opacity="0.16"/>

  <!-- 底部「学元」标记：一枚方孔钱，暗示结算货币 -->
  <g transform="translate(44,48)" opacity="0.92">
    <circle cx="0" cy="0" r="7.2" fill="none" stroke="#E8C36A" stroke-width="1.6"/>
    <rect x="-2.2" y="-2.2" width="4.4" height="4.4" rx="0.7" fill="#E8C36A"/>
  </g>
</svg>
